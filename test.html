<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      position: relative;
      display: flex;
      justify-content: center;
      background: aliceblue;
      padding: 15px;
      gap: 1rem;
      flex-direction: column;
      max-width: 450px;
      width: 100%;
      border-radius: 5px;
    }

    .card::after {
      content: "";
      position: absolute;
      left: -15px;
      right: -15px;
      top: -15px;
      bottom: -15px;
      background: darkblue;
      z-index: -1;
      opacity: 0.3;
      border-radius: 10px;
      filter: blur(25px);
      animation: glowPulse 2s infinite ease-in-out;
    }

    .card__title {
      margin: 0
    }

    .card__content {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .card__text {
      font-size: 20px;
    }

    .card__icon {
      font-size: 20px;
      border: 1px solid #000;
      border-radius: 50%;
      padding: 6px 5px 6px 5px;
    }

    .card__body {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    @keyframes glowPulse {
      0% {
        opacity: 0.2;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 0.2;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="card__header">
        <h2 class="card__title">
          Profile Info
        </h2>
      </div>
      <div class="card__body">
        <div class="card__content">
          <div class="card__icon">AB </div>
          <div class="card__text"> MERN stack </div>
        </div>
        <div class="card__description">I develop scalable and user-friendly web applications using React.js and Node.js.
          I handle frontend and backend development, optimize databases, and ensure application security and
          performance.</div>
        <div>
          <div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
